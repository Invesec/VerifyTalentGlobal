{% extends "base.html" %}
{% block content %}
<section class="section form-page">
  <div class="wrap narrow">
    <h1>Log in</h1>
    {% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="login-form">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email" maxlength="254">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" maxlength="128">
      </div>
      <button class="btn btn-navy" type="submit">Log in</button>
      <p class="form-alt"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
      <p class="form-alt">New here? <a href="{{ url_for('auth.register') }}">Join the talent network</a></p>
    </form>
  </div>
</section>
{% endblock %}
